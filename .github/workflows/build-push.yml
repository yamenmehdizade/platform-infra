name: Build and Push

on:
  push:
    branches: [master]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 028185488284.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: platform-dev

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:backend-${{ github.sha }} \
            apps/backend/

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:backend-${{ github.sha }}
          severity: CRITICAL
          exit-code: 1

      - name: Push to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:backend-${{ github.sha }}

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Frontend
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-${{ github.sha }} \
            apps/frontend/
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:frontend-${{ github.sha }}

  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name platform-stage \
            --region eu-central-1

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.21.0

      - name: Deploy Backend
        run: |
          helm upgrade --install backend ./helm/backend \
            --namespace backend \
            --create-namespace \
            --set image.tag=backend-${{ github.sha }} \
            --wait \
            --timeout 5m

      - name: Deploy Frontend
        run: |
          helm upgrade --install frontend ./helm/frontend \
            --namespace frontend \
            --create-namespace \
            --set image.tag=frontend-${{ github.sha }} \
            --wait \
            --timeout 5m

      - name: Smoke Test
        run: |
          POD=$(kubectl get pod -n backend -l app=backend -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n backend $POD -- wget -qO- http://localhost:8080/health
          echo "Smoke test passed!"
