<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
    header { background: #1e293b; padding: 20px 40px; border-bottom: 1px solid #334155; }
    header h1 { color: #38bdf8; font-size: 24px; }
    header span { color: #64748b; font-size: 14px; }
    .container { padding: 40px; max-width: 1200px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
    .card h3 { color: #64748b; font-size: 13px; text-transform: uppercase; margin-bottom: 12px; }
    .card .value { font-size: 28px; font-weight: bold; color: #38bdf8; }
    .card .label { font-size: 13px; color: #64748b; margin-top: 4px; }
    .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; }
    .status.ok { background: #064e3b; color: #34d399; }
    .status.error { background: #7f1d1d; color: #f87171; }
    .info-card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
    .info-card h2 { color: #e2e8f0; margin-bottom: 20px; }
    .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #334155; }
    .info-row:last-child { border-bottom: none; }
    .info-row .key { color: #64748b; }
    .info-row .val { color: #e2e8f0; font-weight: 500; }
    .loading { color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Platform Dashboard</h1>
    <span>Infrastructure Monitoring — dev environment</span>
  </header>

  <div class="container">
    <div class="grid">
      <div class="card">
        <h3>API Status</h3>
        <div class="value" id="api-status"><span class="loading">...</span></div>
        <div class="label">Backend Health</div>
      </div>
      <div class="card">
        <h3>Database</h3>
        <div class="value" id="db-status"><span class="loading">...</span></div>
        <div class="label">PostgreSQL</div>
      </div>
      <div class="card">
        <h3>Uptime</h3>
        <div class="value" id="uptime"><span class="loading">...</span></div>
        <div class="label">Seconds</div>
      </div>
    </div>

    <div class="info-card">
      <h2>Infrastructure Info</h2>
      <div class="info-row">
        <span class="key">Cluster</span>
        <span class="val" id="cluster">...</span>
      </div>
      <div class="info-row">
        <span class="key">Region</span>
        <span class="val" id="region">...</span>
      </div>
      <div class="info-row">
        <span class="key">Environment</span>
        <span class="val" id="environment">...</span>
      </div>
      <div class="info-row">
        <span class="key">Last Updated</span>
        <span class="val" id="timestamp">...</span>
      </div>
    </div>
  </div>

  <script>
    const BACKEND = '/api';

    async function fetchHealth() {
      try {
        const r = await fetch(BACKEND + '/health');
        const d = await r.json();
        document.getElementById('api-status').innerHTML =
          `<span class="status ok">${d.status}</span>`;
        document.getElementById('db-status').innerHTML =
          `<span class="status ${d.database === 'ok' ? 'ok' : 'error'}">${d.database}</span>`;
      } catch (e) {
        document.getElementById('api-status').innerHTML =
          `<span class="status error">error</span>`;
      }
    }

    async function fetchLive() {
      try {
        const r = await fetch(BACKEND + '/health/live');
        const d = await r.json();
        document.getElementById('uptime').textContent =
          Math.floor(d.uptime) + 's';
      } catch (e) {}
    }

    async function fetchInfo() {
      try {
        const r = await fetch(BACKEND + '/api/info');
        const d = await r.json();
        document.getElementById('cluster').textContent = d.cluster;
        document.getElementById('region').textContent = d.region;
        document.getElementById('environment').textContent = d.environment;
        document.getElementById('timestamp').textContent =
          new Date(d.timestamp).toLocaleString();
      } catch (e) {}
    }

    fetchHealth();
    fetchLive();
    fetchInfo();
    setInterval(fetchHealth, 10000);
    setInterval(fetchLive, 5000);
    setInterval(fetchInfo, 30000);
  </script>
</body>
</html>
