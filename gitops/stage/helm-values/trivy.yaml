trivy:
  ignoreUnfixed: true
  severity: "CRITICAL,HIGH"

operator:
  scanJobTimeout: 5m
  vulnerabilityReportsPlugin: "Trivy"
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  infraAssessmentScannerEnabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
